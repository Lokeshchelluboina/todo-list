<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <h1>Todo List</h1>

    <!-- Task Input -->
    <div class="task-form">
        <input type="text" id="task-input" placeholder="Enter your task">
        <button id="add-task-btn">Add Task</button>
    </div>

    <!-- Task List -->
    <ul id="task-list">

        <!-- Task Item -->
        <li class="task-item">
            <div class="task">
                <div class="task-text-n-date">
                    <span class="task-text">Task 101</span>
                    <span class="task-date">Today at 11:11 PM</span>
                </div>
                <div class="task-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                    <button class="toggle-btn">Complete</button>
                </div>
            </div>
        </li>

        <li class="task-item completed">
            <div class="task">
                <div class="task-text-n-date">
                    <span class="task-text">Task 102</span>
                    <span class="task-date">Today at 11:20 PM</span>
                </div>
                <div class="task-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                    <button class="toggle-btn">Undo</button>
                </div>
            </div>
        </li>

        <li class="task-item">
            <div class="task">
                <div class="task-text-n-date">
                    <span class="task-text">Task 103</span>
                    <span class="task-date">Today at 11:30 PM</span>
                </div>
                <div class="task-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                    <button class="toggle-btn">Complete</button>
                </div>
            </div>
        </li>

    </ul>
</div>

<script src="./script.js"></script>
</body>
</html>
